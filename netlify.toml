# Mutolaa Lab — Netlify sozlamalari

[build]
  publish = "."
  functions = "netlify/functions"

# Ilova barcha yo'llarda ochilsin (bitta sahifali ilova)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
